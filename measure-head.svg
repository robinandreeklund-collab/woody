<text x="40.0" y="50.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="21" font-weight="700" fill="#23262b" text-anchor="start">FAST MÄTHUVUD — designförslag (en oblik kanal: kamera + laser i fasta vinklar)</text>
<text x="40.0" y="74.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="11.5" font-weight="400" fill="#6a6e74" text-anchor="start">Aluminiumplatta 50 mm bred · kamera &amp; laser FASTA (kalibreras en gång) · centrum-tiltaxel riktar HELA huvudet, lås sen. Geometri: WD 710, kam 20°, laser 40°, θ 20°, baslinje 247.</text>
