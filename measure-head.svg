<rect x="40.0" y="920.0" width="1600.0" height="230.0" rx="8" fill="#fff" stroke="#23262b" stroke-width="1.4" opacity="1"/>
<rect x="40.0" y="920.0" width="1600.0" height="26.0" rx="8" fill="#23262b" stroke="#23262b" stroke-width="0" opacity="1"/>
<text x="52.0" y="938.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="start">NOTER — bygg &amp; montering</text>
<text x="52.0" y="962.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#23262b" text-anchor="start">• FASTA vinklar: kamera och laser sitter permanent ±10° mot plattans normal (→ θ=20°). Kalibrera EN gång, lås. De ändras aldrig.</text>
<text x="52.0" y="987.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#23262b" text-anchor="start">• TILT: hela huvudet vrids om CENTRUM-tiltaxeln (genom centrumhålet, mellan två profiler) för att rikta laserlinjen rätt på brädan + sätta obliktet ~30°. LÅS efter inriktning.</text>
<text x="52.0" y="1012.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#23262b" text-anchor="start">• Eftersom kamera+laser sitter på SAMMA styva platta rör sig deras geometri aldrig relativt varandra → stabil kalibrering (som en kommersiell sensor).</text>
<text x="52.0" y="1037.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#23262b" text-anchor="start">• TERMIK: laser i metallklämma med god kontakt mot plattan (+ ev. värmepasta) → plattan = kylfläns. INGEN fläkt (vibration!). 100 mW klarar plattkontakt med marginal.</text>
<text x="52.0" y="1062.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#23262b" text-anchor="start">• Montera kameran på samma platta (hjälper även dess värmeavledning). Plattjocklek ≥10 mm för styvhet; gärna förstyvningsklack vid laserklämman.</text>
<text x="52.0" y="1087.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#23262b" text-anchor="start">• Tiltaxeln bör ligga nära plattans tyngdpunkt/optiklinje → tilt = mest omriktning, lite translation. Lås med bult + tandbricka eller klämkloss.</text>
<text x="52.0" y="1112.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#23262b" text-anchor="start">• Spegla samma huvud för andra kanalen (grön) → båda konvergerar på samma laserlinje.</text>
<text x="52.0" y="1137.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#23262b" text-anchor="start">• BRÄDSTORLEK: bredd/längd = bara mjukvara (antal rader). Tjocklek mäts direkt inom mätområdet → INGEN tilt vid storleksbyte (bara om WD/bandhöjd ändras). Dimensionera djupfönstret för tjockleksspannet.</text>
</svg>