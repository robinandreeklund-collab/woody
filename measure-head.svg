<text x="1310.0" y="420.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="700" fill="#23262b" text-anchor="middle">PLATTANS LÄNGD (längs baslinjen):</text>
