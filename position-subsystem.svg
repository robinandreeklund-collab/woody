<rect x="40.0" y="880.0" width="1560.0" height="110.0" rx="8" fill="#fff" stroke="#e6e4dc" stroke-width="1.4" opacity="1"/>
<text x="54.0" y="904.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.6" font-weight="700" fill="#23262b" text-anchor="start">POSITION(rad)  =  encoder-pulser sedan LEDANDE-KANT-nollan  ×  mm/puls  +  fast offset givare→laserlinje.   Encodern = kontinuerlig förflyttning; nollan = kant-händelsen.</text>
<text x="54.0" y="922.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.6" font-weight="400" fill="#23262b" text-anchor="start">LR400 svarar på din fråga: JA — när ledande kanten når LR-planet ser alla 3 brädan 'dyka upp' → det ger kant-nollan OCH skevnad. Så LR400 kan ERSÄTTA fotocellen som nolla.</text>
<text x="54.0" y="940.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.6" font-weight="400" fill="#23262b" text-anchor="start">MEN LR400 ger bara tjocklek vid sina punkter, inte hur långt brädan färdats efteråt → encodern behövs ändå för positionen mellan/efter kanten.</text>
<text x="54.0" y="958.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.6" font-weight="400" fill="#23262b" text-anchor="start">Alla uppströms-givare (mäthjul · fotocell · LR400) sitter FÖRE den optiska zonen och utanför FOV. Linjekameran exponerar EN rad och de oblika lasrarna träffar bara sin linje</text>
<text x="54.0" y="976.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.6" font-weight="400" fill="#23262b" text-anchor="start">→ mäthjulet stör aldrig bilden (din poäng stämmer). Håll klustret inom brädans 75 mm så brädan täcker givarna under hela skanningen (här schematiskt utdraget).</text>
</svg>