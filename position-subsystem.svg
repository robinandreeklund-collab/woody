<text x="60.0" y="366.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#6a6e74" text-anchor="start">E6B2-CWZ1X · Ø40+1000P → 0,126 mm/puls</text>
