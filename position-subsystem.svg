<text x="60.0" y="334.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#2f9e6e" text-anchor="start">kvadratur → DUBBELRIKTAD (upp/ned)</text>
