<text x="40.0" y="76.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="12" font-weight="400" fill="#6a6e74" text-anchor="start">Fast anhåll + fotocell i bakkant = stabil repeterbar nolla · encoder mot bandet = inkrement → ABSOLUT position. Tvärsnitt/optik: head-mech.svg.</text>
