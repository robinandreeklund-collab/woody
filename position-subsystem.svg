<text x="54.0" y="927.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.2" font-weight="700" fill="#23262b" text-anchor="start">NOLLA = FAST ANHÅLL + FOTOCELL i bakkant. Lägg brädans bakkant mot anhållet → fotocellen ser anslag → encodern NOLLAS. Anhållet kvadrar dessutom brädan (ingen skevhet vid iladdning).</text>
<text x="54.0" y="946.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.2" font-weight="700" fill="#23262b" text-anchor="start">ABSOLUT POSITION = encoder-inkrement (mäthjul mot bandet, dubbelriktad) räknat FRÅN anhålls-nollan. Stabil eftersom nollan är ett mekaniskt anslag du alltid kan återgå till.</text>
<text x="54.0" y="965.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.2" font-weight="700" fill="#23262b" text-anchor="start">DUBBELRIKTAT: kör fram (encoder räknar upp), backa tillbaka (räknar ned). Når du anhållet igen → fotocell → AUTO-OMNOLLNING. Driftfri, repeterbar nolla varje cykel.</text>
<text x="54.0" y="984.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.2" font-weight="400" fill="#23262b" text-anchor="start">Tre RADER nedström: LR400 −45 mm (tjocklek-ankare/kant/skevhet) · laserlinje 0 (profil, röd+grön) · färgkamera +40 mm (ren färg, ingen laser). Sys ihop via encoderpositionen.</text>
<text x="54.0" y="1003.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.2" font-weight="400" fill="#23262b" text-anchor="start">Huvudens exakta geometri (WD 710, kam 20°/Z667/Y243, laser 40°/Z544/Y456, θ20°, vankant, ytkamera) finns i head-mech.svg (tvärsnittet). Mäthjul mäter bandet → slir mildras med griff + mjukvarukant-korr.</text>
</svg>