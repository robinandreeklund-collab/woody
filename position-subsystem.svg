<text x="760.0" y="844.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#6a6e74" text-anchor="end">(encoderns läge kräver ingen offset — mäter bandet)</text>
<rect x="40.0" y="880.0" width="1560.0" height="110.0" rx="8" fill="#fff" stroke="#e6e4dc" stroke-width="1.4" opacity="1"/>
<text x="54.0" y="904.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.6" font-weight="700" fill="#23262b" text-anchor="start">POSITION = encoder-inkrement (mäthjul mot bandet)  +  KANT-NOLLA (LR400/fotocell vid linjen).   Absolut åt BÅDA hållen — kvadratur räknar upp/ned vid backning.</text>
<text x="54.0" y="922.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.6" font-weight="400" fill="#23262b" text-anchor="start">Encodern rullar mot bandets RETURSIDA → alltid kontakt, rör aldrig brädan, ingen dödzon vid vändning, ingen skevkraft. Dess fysiska läge behöver INGEN offset (mäter bandet).</text>
<text x="54.0" y="940.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.6" font-weight="400" fill="#23262b" text-anchor="start">Pris: band↔bräda-slir. Mildras med gripande/mönstrat band (+ ev. hålldon) och, vid sub-mm-krav, mjukvarukorrektion via brädans kanter (hela brädan avbildas ändå).</text>
<text x="54.0" y="958.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.6" font-weight="400" fill="#23262b" text-anchor="start">Alternativ: encoder kopplad direkt till en rullaxel → eliminerar även hjul-mot-band-slir.</text>
<text x="54.0" y="976.0" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="10.6" font-weight="400" fill="#23262b" text-anchor="start">LR400-planet ger kant-nolla + skevhet (3 punkter) → kan ERSÄTTA fotocellen. Uppströms-givare + linjekamera ligger utanför FOV; kameran exponerar bara sin rad.</text>
</svg>